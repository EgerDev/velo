<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 280px;
        font: 13px/1.4 "IBM Plex Sans", system-ui, sans-serif;
        background: #141416;
        color: #f2f1ee;
      }
      main {
        padding: 14px;
      }
      h1 {
        margin: 0 0 6px;
        font: 18px/1.1 "Instrument Serif", Georgia, serif;
      }
      p {
        margin: 0 0 12px;
        color: #9a9892;
      }
      button {
        width: 100%;
        margin: 0 0 8px;
        height: 36px;
        border: 0;
        border-radius: 8px;
        background: #e8e4dc;
        color: #0c0c0e;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #1c1c1f;
        color: #f2f1ee;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      #status {
        min-height: 1.4em;
        color: #9a9892;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Velo session</h1>
      <p>Reads HttpOnly YouTube cookies this page cannot see, then sends them to an open Velo tab.</p>
      <button id="send">Send to Velo tab</button>
      <button id="har" class="secondary">Capture live HAR</button>
      <button id="copy" class="secondary">Copy cookies.txt</button>
      <button id="download" class="secondary">Download cookies.txt</button>
      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
