# Dependency updates. The extraction family (youtubei.js, undici,
# socks-proxy-agent) is refreshed weekly by auto-update.yml with a
# rollback verifier, so it is ignored here. Dependabot also honours these
# ignores for security updates: auto-update covers them within a week.
# pip (yt-dlp) is added by W5 together with requirements.txt.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      radix:
        patterns: ["@radix-ui/*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: youtubei.js
      - dependency-name: undici
      - dependency-name: socks-proxy-agent
      - dependency-name: nitro # exact-pinned beta; W4a owns the upgrade
      - dependency-name: nf3 # pinned through package.json overrides

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
