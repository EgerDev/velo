# Weekly refresh of the extraction libraries that track the YouTube player
# (youtubei.js, undici, socks-proxy-agent). Everything else
# is Dependabot's (.github/dependabot.yml); yt-dlp moves to Dependabot pip once
# requirements.txt exists (W5).
#
# Two jobs, so new third-party code never runs next to a write credential:
#   update  - read-only token, no persisted git credentials, no lifecycle
#             scripts. Installs the new versions, verifies them with
#             typecheck + test + lint + build (rolling back anything that
#             fails), and uploads package.json + package-lock.json as files.
#   open-pr - runs no package code. Downloads the two files outside the
#             checkout, checks them (exactly those two regular files, valid
#             JSON, every lockfile `resolved` on registry.npmjs.org) before any
#             git command, copies them in, then opens the PR with a GitHub App
#             token so ci.yml runs on it. Skipped until the owner configures
#             the App.
name: auto-update

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      # egress-policy: audit only records outbound traffic (detection, not containment).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deliberately no `cache` input: this job runs brand-new package code and
      # must not be able to write a cache that other workflows restore.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: update the extraction family (3-day release cooldown, no install scripts)
        env:
          npm_config_ignore_scripts: "true"
        run: |
          export NPM_CONFIG_BEFORE="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          npm run update:deps -- --skip-ytdlp --only=youtubei.js,undici,socks-proxy-agent
      - id: diff
        run: |
          if git diff --quiet -- package.json package-lock.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 3

  open-pr:
    needs: update
    if: needs.update.outputs.changed == 'true' && vars.DEPS_BOT_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # the App token below does the writing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The artifact is produced by a job that ran untrusted code: it lands
      # outside the checkout and is checked before any git command runs.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manifests
          path: ${{ runner.temp }}/manifests
      - name: accept only package.json and package-lock.json, as plain registry-only JSON
        env:
          d: ${{ runner.temp }}/manifests
        run: |
          set -euo pipefail
          listing="$(LC_ALL=C ls -A "$d")"
          if [ "$listing" != "$(printf 'package-lock.json\npackage.json')" ]; then
            echo "::error::artifact must hold exactly package.json and package-lock.json, got: $listing"
            exit 1
          fi
          for f in package.json package-lock.json; do
            if ! { [ -f "$d/$f" ] && [ ! -L "$d/$f" ]; }; then
              echo "::error::$f is not a regular file"
              exit 1
            fi
            jq empty "$d/$f"
          done
          if ! jq -e '[.. | .resolved? // empty | select(startswith("https://registry.npmjs.org/") | not)] | length == 0' "$d/package-lock.json" > /dev/null; then
            echo "::error::package-lock.json resolves a package outside https://registry.npmjs.org/"
            exit 1
          fi
          cp "$d/package.json" "$d/package-lock.json" .
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: auto-update/dependencies
          title: "chore(deps): weekly extraction-library update"
          commit-message: "chore(deps): weekly extraction-library update"
          add-paths: |
            package.json
            package-lock.json
          delete-branch: true
          body: |
            Automated by `.github/workflows/auto-update.yml` (3-day release cooldown).
            Each version was installed without lifecycle scripts in a read-only job and kept
            only if typecheck + test + lint + build passed; `ci` re-verifies this PR.

  report-failure:
    needs: [update, open-pr]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "auto-update failed ($(date -u +%F))" \
            --body "Scheduled run failed: $RUN_URL"
