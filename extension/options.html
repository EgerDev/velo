<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velo Extension Preferences</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --surface: #121216;
      --elevated: #1a1a22;
      --border: rgba(255, 255, 255, 0.1);
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #f43f5e;
    }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 32px;
      max-width: 560px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .logo-icon {
      font-size: 24px;
      background: linear-gradient(135deg, #f43f5e, #be123c);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
    }
    p.subtitle {
      font-size: 12px;
      color: var(--muted);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .help-text {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    input[type="text"], select {
      width: 100%;
      height: 38px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      padding: 0 12px;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      padding: 0 20px;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .status-alert {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">⚡</div>
    <div>
      <h1>Velo Extension Settings</h1>
      <p class="subtitle">Configure default download qualities and Velo web app connection</p>
    </div>
  </div>

  <form id="settings-form">
    <div class="form-group">
      <label for="velo-server-url">Velo Web Server URL</label>
      <input type="text" id="velo-server-url" placeholder="http://127.0.0.1:8080" required>
      <p class="help-text">The base URL of your running Velo instance (local or deployed Vercel domain).</p>
    </div>

    <div class="form-group">
      <label for="default-preset">Default Download Preset</label>
      <select id="default-preset">
        <option value="1080p">1080p Full HD (Recommended)</option>
        <option value="720p">720p HD</option>
        <option value="4k">4K / 2160p Ultra HD</option>
        <option value="audio">Audio Only (High-Bitrate MP3/AAC)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="default-lang">Preferred Transcript Language</label>
      <select id="default-lang">
        <option value="en">English (en)</option>
        <option value="es">Spanish (es)</option>
        <option value="fr">French (fr)</option>
        <option value="de">German (de)</option>
        <option value="pt">Portuguese (pt)</option>
        <option value="ja">Japanese (ja)</option>
      </select>
    </div>

    <button type="submit" class="btn">Save Preferences</button>
    <div id="status-alert" class="status-alert">✓ Preferences saved successfully!</div>
  </form>

  <script src="options.js"></script>
</body>
</html>
